<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header><h1>Mi contacto</h1></header>
    <main>
        <form action="/prcesar" method="post">
            <fieldset>
                <legend>Formulario de contacto</legend>
                <label for="name">Nombre</label>
                <input type="text" id="name" name="Nombre" required>
                <br>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required >
                <br>
                <label for="issue">Asunto</label>
                <select name="issue" id="issue" required>
                    <option value="">Seleccione un asunto</option>
                    <option value="estudio">Estudio</option>
                    <option value="trabajo">Trabajo</option>
                    <option value="otro">Otro</option>

                </select>
                <br>
                <label for="message">Mensaje</label>
                <textarea name="message" id="message" rows="5" required></textarea>
                <br>
                <input type="checkbox" id="checkbox" name="aceptar" required>
                <label for="checkbox">Acepto que me contacten</label>
                <br>
                <button type="submit"> Ennviar mensaje</button>
                <button type="reset">Borrar todo</button>



            </fieldset>





        </form>


    </main>
</body>
</html>
